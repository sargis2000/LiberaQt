site_name: LiberaQT
site_description: Modern UI automation for Qt desktop applications
site_url: https://sargis2000.github.io/LiberaQt/
repo_url: https://github.com/sargis2000/LiberaQt
repo_name: sargis2000/LiberaQt
copyright: LiberaQT — UI automation for Qt desktop applications, scoped narrowly and deliberately.

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            signature_crossrefs: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Your first test: getting-started/first-test.md
      - How it works: getting-started/concepts.md
  - Guide:
      - Selectors: guide/selectors.md
      - Actions: guide/actions.md
      - Waiting and assertions: guide/waiting.md
      - Object maps: guide/object-maps.md
      - Child processes and ABIs: guide/child-processes.md
      - Running under pytest: guide/pytest.md
      - Command line: guide/cli.md
  - Troubleshooting: troubleshooting.md
  - Reference:
      - Python API: reference/api.md
      - Selector grammar: SELECTORS.md
      - Wire protocol: PROTOCOL.md
      - Actions matrix: ACTIONS.md
      - Architecture: ARCHITECTURE.md
      - Injection: INJECTION.md
      - API philosophy: API.md
  - Project:
      - Contributing: CONTRIBUTING.md
      - Roadmap: ROADMAP.md
      - Open questions: OPEN_QUESTIONS.md
