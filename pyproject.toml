[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liberaqt"
version = "0.1.0.dev0"
description = "Modern UI automation for Qt desktop applications (Qt 5.15 / 6.7), Python-only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sargis Khachatryan", email = "khachatryansargis2000@gmail.com" }]
keywords = ["qt", "qml", "gui", "testing", "automation", "pyside", "pytest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typing-extensions>=4.0; python_version<'3.11'",
  # liberaqt.toml is read with tomllib, which only joined the standard library in 3.11. Without
  # this, every 3.9 and 3.10 user -- and the 3.9 CI leg -- had their liberaqt.toml ignored.
  "tomli>=1.1; python_version<'3.11'",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "ruff",
  "mypy",
  "PyYAML>=6.0",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
]

[project.scripts]
liberaqt = "liberaqt.cli:main"

[project.entry-points.pytest11]
liberaqt = "liberaqt.pytest_plugin"

[project.urls]
Homepage = "https://github.com/sargis2000/LiberaQt"
Documentation = "https://github.com/sargis2000/LiberaQt/tree/main/docs"
Issues = "https://github.com/sargis2000/LiberaQt/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/liberaqt"]

# The documentation sources travel inside the wheel, so `liberaqt docs` works from a plain
# `pip install` and not only from a checkout. mkdocs resolves `docs_dir:` relative to the config
# file, so the packaged layout needs no rewriting of mkdocs.yml.
[tool.hatch.build.targets.wheel.force-include]
"docs" = "liberaqt/_docs/docs"
"mkdocs.yml" = "liberaqt/_docs/mkdocs.yml"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
# D105/D107: a magic method's name is its documentation, and constructor arguments are described
# on the class itself rather than split across two docstrings.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names and their bodies are the documentation; a docstring is added only when the *reason*
# for a test is not obvious from reading it.
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]
# The live-application suite is tests too, and additionally needs a bare `except` in its
# cleanup helpers: a teardown that raises would mask the real failure it is unwinding.
"tests/e2e/**" = ["D100", "D101", "D102", "D103", "D104", "BLE001"]

[tool.pytest.ini_options]
# Only the no-Qt suite. The live tests under tests/e2e drive real applications -- Qt Assistant,
# and Libero SoC, which writes projects to disk -- so they are opted into by path and never by
# accident. tests/conftest.py enforces the same rule for `pytest tests`.
testpaths = ["tests/unit"]
markers = [
  "live: drives a real application; needs it installed and a matching agent",
  "qt_app: drives one of Qt's own shipped tools",
  "libero: drives Microchip Libero SoC (Qt 5.15 / MSVC / x86)",
  "writes_disk: creates files outside pytest's tmp directories",
  "slow: takes minutes rather than seconds",
]
