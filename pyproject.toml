[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liberaqt"
version = "0.1.0.dev0"
description = "Playwright-style UI automation for Qt desktop applications (Qt 5.15 / 6.7), Python-only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "LiberaQT contributors" }]
keywords = ["qt", "qml", "gui", "testing", "automation", "squish", "pyside", "pytest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typing-extensions>=4.0; python_version<'3.11'",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "ruff",
  "mypy",
  "PyYAML>=6.0",
]

[project.scripts]
liberaqt = "liberaqt.cli:main"

[project.entry-points.pytest11]
liberaqt = "liberaqt.pytest_plugin"

[project.urls]
Homepage = "https://github.com/OWNER/liberaqt"
Documentation = "https://github.com/OWNER/liberaqt/tree/main/docs"
Issues = "https://github.com/OWNER/liberaqt/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/liberaqt"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
