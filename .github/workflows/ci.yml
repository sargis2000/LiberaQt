name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Python client (no Qt needed)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest tests/ -q

  agent:
    name: Agent + integration (Qt ${{ matrix.qt }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,  qt: "6.7.2",  tag: "qt6.7-linux-x86_64-gcc" }
          - { os: ubuntu-22.04,  qt: "5.15.2", tag: "qt5.15-linux-x86_64-gcc" }
          - { os: windows-2022,  qt: "6.7.2",  tag: "qt6.7-windows-x86_64-msvc2022" }
          - { os: windows-2022,  qt: "5.15.2", tag: "qt5.15-windows-x86_64-msvc2019" }
    steps:
      - uses: actions/checkout@v4

      # qttools brings Designer, Assistant and Linguist -- the applications the integration suite
      # drives. They ship inside the Qt installation, so they always match the agent's ABI.
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: ${{ startsWith(matrix.qt, '6') && 'qtdeclarative qttools' || 'qttools' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - name: Build agent
        run: |
          cmake -S agent -B build/agent -DCMAKE_BUILD_TYPE=Release
          cmake --build build/agent --config Release --parallel
          cmake --install build/agent --prefix ${{ github.workspace }}/agents/${{ matrix.tag }}

      # The suite locates Designer/Assistant/Linguist beside qmake, which install-qt-action puts
      # on PATH, so neither leg has to hardcode a Qt layout.
      - name: Integration tests against Qt's own applications (Linux)
        if: runner.os == 'Linux'
        env:
          LIBERAQT_AGENT_PATH: ${{ github.workspace }}/agents
        run: xvfb-run -a pytest integration/ -q --liberaqt-qt ${{ matrix.qt }}

      - name: Integration tests against Qt's own applications (Windows)
        if: runner.os == 'Windows'
        env:
          LIBERAQT_AGENT_PATH: ${{ github.workspace }}/agents
        run: pytest integration/ -q --liberaqt-qt ${{ matrix.qt }}

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: liberaqt-trace-${{ matrix.tag }}
          path: liberaqt-trace/

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.tag }}
          path: agents/${{ matrix.tag }}
