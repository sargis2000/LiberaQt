name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Python client (no Qt needed)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      # tests/unit, not tests/: the live suites under tests/e2e drive real applications and are
      # opted into by path. Naming the unit tree keeps CI from even importing them, so a broken
      # import over there cannot redden a run that never intended to execute it.
      - run: pytest tests/unit -q

  # The documentation ships inside the wheel (force-include in pyproject). Nothing in the unit
  # tests can notice when that stops working -- they never build a wheel -- and the failure is
  # silent: `liberaqt docs` degrades to the error the packaging exists to remove, with CI green.
  packaging:
    name: Wheel carries the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - name: Assert the docs are in the wheel
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          if "liberaqt/_docs/mkdocs.yml" not in names:
              sys.exit(f"{wheel} has no liberaqt/_docs/mkdocs.yml")
          pages = [n for n in names if n.startswith("liberaqt/_docs/docs/") and n.endswith(".md")]
          if not pages:
              sys.exit(f"{wheel} carries mkdocs.yml but no documentation pages")
          print(f"{wheel}: mkdocs.yml + {len(pages)} pages")
          EOF

  # Builds the agent on every supported ABI. This is a compile check only: nothing here runs the
  # agent, because the tests that drove real Qt applications have been removed. A green matrix
  # therefore says the C++ still builds against Qt 5.15 and 6.7 -- not that it works.
  agent:
    name: Agent build (Qt ${{ matrix.qt }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,  qt: "6.7.2",  tag: "qt6.7-linux-x86_64-gcc" }
          - { os: ubuntu-22.04,  qt: "5.15.2", tag: "qt5.15-linux-x86_64-gcc" }
          - { os: windows-2022,  qt: "6.7.2",  tag: "qt6.7-windows-x86_64-msvc2022" }
          - { os: windows-2022,  qt: "5.15.2", tag: "qt5.15-windows-x86_64-msvc2019" }
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: ${{ startsWith(matrix.qt, '6') && 'qtdeclarative' || '' }}

      - name: Build agent
        run: |
          cmake -S agent -B build/agent -DCMAKE_BUILD_TYPE=Release
          cmake --build build/agent --config Release --parallel
          cmake --install build/agent --prefix ${{ github.workspace }}/agents/${{ matrix.tag }}

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.tag }}
          path: agents/${{ matrix.tag }}
